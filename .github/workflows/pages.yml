name: Browser emulator Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake python3-venv asciidoctor poppler-utils fonts-liberation fontconfig
      - name: Install pinned web SDK
        run: src/RunCPM_7xtgv-terminal/tools-web/setup.sh
      - name: Install Chromium runtime dependencies
        run: build/RunCPM_7xtgv-terminal/desktop-web/_deps/venv/bin/python -m playwright install --with-deps chromium
      - name: Fetch verified Arduino GFX 1.6.4
        shell: python
        run: |
          import pathlib, sys
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / 'src/RunCPM_7xtgv-terminal/tools-win'))
          from windows_build import install_gfx
          install_gfx(root / 'build/RunCPM_7xtgv-terminal/desktop-web/_deps/GFX_Library_for_Arduino-1.6.4')
      - name: Refresh mobile guide PDFs
        env:
          XTGV_PDF_BROWSER: ''
        run: src/RunCPM_7xtgv-terminal/tools-web/reprint.sh
      - name: Build runtime and package committed card
        env:
          XTGV_GFX_SOURCE: ${{ github.workspace }}/build/RunCPM_7xtgv-terminal/desktop-web/_deps/GFX_Library_for_Arduino-1.6.4
        run: |
          src/RunCPM_7xtgv-terminal/tools-web/desktop-rebuild.sh
          src/RunCPM_7xtgv-terminal/tools-web/reprint.sh --check
          src/RunCPM_7xtgv-terminal/tools-web/pages-package.sh
      - name: Check headerless Pages startup in Chromium
        env:
          XTGV_TEST_BROWSER: ''
        run: |
          build/RunCPM_7xtgv-terminal/desktop-web/_deps/venv/bin/python src/RunCPM_7xtgv-terminal/tools-web/tests/pages_host.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/RunCPM_7xtgv-terminal/desktop-web/pages
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy generated site
        id: deployment
        uses: actions/deploy-pages@v4
