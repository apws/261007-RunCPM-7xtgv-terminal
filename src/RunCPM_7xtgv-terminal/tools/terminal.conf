# Characters produced by Alt plus the Czech top number row without Shift.
# Each position selects the corresponding history bank number below.
XTGV_BANK_KEYS='+ěščřžýáíé'
XTGV_BANK_NUMBERS='1234567890'
export XTGV_BANK_KEYS XTGV_BANK_NUMBERS

# Konsole/Kitty and Windows Mintty: unshifted top-row characters, positions 1..0.
# Row bindings emit configurable num1..num0 events (ASCII digits by default).
# Empty disables plain/Shift row conversion; brightness and Alt-bank keys remain.
# Use a single quoted literal; keymap launchers read only this assignment.
# Applied on the next new mirror launch; an inherited value takes precedence.
XTGV_HACK_TOPROW='+ěščřžýáíé'
export XTGV_HACK_TOPROW

# Optional host VTPUT/VTGET root; defaults to XTGV_CARD_ROOT or repository cpmcard.
# Used for Send and Receive, independent of the launch directory.
# XTGV_TRANSFER_ROOT='/absolute/path/to/cpmcard'
# export XTGV_TRANSFER_ROOT

# Optional: a CP/M A0:REFLASH.COM emits CSI >64v.  terminal.py consumes that
# event and runs this command only when it is explicitly configured.  Leave it
# unset until a target-specific uploader command has been chosen; this avoids
# flashing an RP2350 image onto an ESP32-S3 (or vice versa).
# Current attached target.  Change this named target (and optional XTGV_PORT)
# before moving the mirror to another module.  The common dispatcher owns all
# host upload choices; firmware only emits its universal CSI event.
# The dispatcher verifies the running firmware target before every upload.
# Do not configure --allow-unidentified-target here: manual recovery is one-shot.
# Target JSON holds its display-profile/group ID, description and port defaults.
# Set XTGV_PORT only for a deliberate host override; otherwise use target data.
# Current attached module: ESP32-P4 JC8012P4A1C (EP4_10).
# Its target JSON supplies the normal /dev/ttyUSB0 port.
XTGV_TARGET=jc8012p4a1c
# XTGV_PORT=/dev/ttyUSB0
XTGV_REFLASH_COMMAND="$tools_dir/reflash.py"
export XTGV_TARGET XTGV_PORT XTGV_REFLASH_COMMAND
