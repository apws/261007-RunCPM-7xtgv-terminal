# Linux kitty translation of the Windows KiTTY [Shortcuts] profile.
# Launch one of:
#   kitty --config tools/kitty-cpm.conf picocom /dev/ttyACM0
#   kitty --config tools/kitty-cpm.conf python3 tools/terminal.py --port /dev/ttyACM0
#
# These mappings are application-specific CP/M/WordStar-style input, not
# universal CP/M or VT100 key definitions. The original maps both Up and Down
# to the same bytes; this translation preserves that exactly.

map left send_text all \x1b[>30v
map right send_text all \x1b[>31v
map up send_text all \x1b[>36v
map down send_text all \x1b[>37v

map page_up send_text all \x1b[>40v
map page_down send_text all \x1b[>41v

map home send_text all \x1b[>32v
map end send_text all \x1b[>33v
map ctrl+left send_text all \x1b[>42v
map ctrl+right send_text all \x1b[>43v
map ctrl+up send_text all \x1b[>44v
map ctrl+down send_text all \x1b[>45v

map ctrl+home send_text all \x1b[>46v
map ctrl+end send_text all \x1b[>47v
map ctrl+delete send_text all \x1b[>48v
map ctrl+insert send_text all \x1b[>49v
map ctrl+page_up send_text all \x1b[>50v
map ctrl+page_down send_text all \x1b[>51v
map ctrl+shift+home send_text all \x1b[1;3H
map ctrl+shift+end send_text all \x1b[1;3F
map alt+shift+home send_text all \x1b[1;3H
map alt+shift+end send_text all \x1b[1;3F
map ctrl+alt+shift+page_up send_text all \x1b[>66v
map ctrl+alt+shift+page_down send_text all \x1b[>67v
map ctrl+alt+shift+1 send_text all \x1b[>1v
map ctrl+alt+shift+2 send_text all \x1b[>2v
map ctrl+shift+page_up send_text all \x1b[>63;33v
map ctrl+shift+page_down send_text all \x1b[>63;34v
map alt+shift+page_up send_text all \x1b[>63;33v
map alt+shift+page_down send_text all \x1b[>63;34v
map ctrl+backspace send_text all \x18

map delete send_text all \x1b[>34v
map insert send_text all \x1b[>35v
