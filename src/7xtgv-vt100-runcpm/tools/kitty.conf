# Default Linux kitty profile for the 7xtgv CP/M terminal.
# These are application-specific CP/M/WordStar-style mappings translated from
# the Windows KiTTY [Shortcuts] profile.

map left send_text all \x1b[>30v
map right send_text all \x1b[>31v
map up send_text all \x1b[>36v
map down send_text all \x1b[>37v

map page_up send_text all \x1b[>40v
map page_down send_text all \x1b[>41v

map home send_text all \x1b[>32v
map end send_text all \x1b[>33v
map ctrl+left send_text all \x1b[>42v
map ctrl+right send_text all \x1b[>43v
map ctrl+up send_text all \x1b[>44v
map ctrl+down send_text all \x1b[>45v

map ctrl+home send_text all \x1b[>46v
map ctrl+end send_text all \x1b[>47v
map ctrl+delete send_text all \x1b[>48v
map ctrl+insert send_text all \x1b[>49v
map ctrl+page_up send_text all \x1b[>50v
map ctrl+page_down send_text all \x1b[>51v
map ctrl+backspace send_text all \x18

map delete send_text all \x1b[>34v
map insert send_text all \x1b[>35v
map f5 send_text all \x11\x46

# Application-profile Alt keys. Viewport controls remain on Ctrl+] a/e/h/l.
map alt+left send_text all \x1b[>52v
map alt+right send_text all \x1b[>53v
map alt+home send_text all \x1b[>54v
map alt+end send_text all \x1b[>55v
map alt+delete send_text all \x1b[>56v
map alt+insert send_text all \x1b[>57v

# 7xtgv local history: exactly one explicitly selected bank.
map alt+up send_text all \x1b[>38v
map alt+down send_text all \x1b[>39v
map alt+page_up send_text all \x1b[>12v
map alt+page_down send_text all \x1b[>13v
map alt+shift+page_up send_text all \x1b[>58v
map alt+shift+page_down send_text all \x1b[>59v
map alt+0 send_text all \x1b[>20v
map alt+1 send_text all \x1b[>21v
map alt+2 send_text all \x1b[>22v
map alt+3 send_text all \x1b[>23v
map alt+4 send_text all \x1b[>24v
map alt+5 send_text all \x1b[>25v
map alt+6 send_text all \x1b[>26v
map alt+7 send_text all \x1b[>27v
map alt+8 send_text all \x1b[>28v
map alt+9 send_text all \x1b[>29v
map alt+shift+0 send_text all \x1b[>20v
map alt+shift+1 send_text all \x1b[>21v
map alt+shift+2 send_text all \x1b[>22v
map alt+shift+3 send_text all \x1b[>23v
map alt+shift+4 send_text all \x1b[>24v
map alt+shift+5 send_text all \x1b[>25v
map alt+shift+6 send_text all \x1b[>26v
map alt+shift+7 send_text all \x1b[>27v
map alt+shift+8 send_text all \x1b[>28v
map alt+shift+9 send_text all \x1b[>29v
