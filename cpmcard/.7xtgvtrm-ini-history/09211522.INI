;7xtgv terminal config

[display:ES3_5]
view_zoom=2
zoom1_terminal=132x48
zoom2_terminal=80x24
zoom3_terminal=44x16
zoom4_terminal=32x12
render_flush_hz=10

[display:ES3_35]
view_zoom=1
zoom1_terminal=80x32
zoom2_terminal=40x16
zoom3_terminal=26x10
zoom4_terminal=20x8
render_flush_hz=10

[display:RP2_2]
view_zoom=1
zoom1_terminal=80x24
zoom2_terminal=40x12
zoom3_terminal=26x8
zoom4_terminal=20x6
render_flush_hz=0

[global]
backlight_level=14
cursor_blink_ms=250
console_bits=7

mode=ansi

;unified exit and cls .... but that ralt isnt there now, ALT+ESC, ALT+BS
exit_key=lalt+ralt+escape
clear_key=lalt+ralt+delete

;gutter colors
viewport_gutter_rgb=128,128,128
viewport_active_gutter_rgb=active_line


; 7xtgv application profiles. Loaded once at boot from A/0/7XTGVTRM.INI.

[bank0]
name=A0: CCP
; Inactive defaults below: remove ';' and edit only to override.
; mode inherits [global]; zoom geometry inherits [display:HALID].
; Replace COLSxROWS before enabling any zoomN_terminal line.
; RunCPM CCP editor; Ctrl motions are from firmware bank defaults.
; Ctrl or Shift combos for cursor and sixpack

; mode=ansi
; input=custom

; zoom1_terminal=COLSxROWS
; zoom2_terminal=COLSxROWS
; zoom3_terminal=COLSxROWS
; zoom4_terminal=COLSxROWS

active_line_rgb=205,255,205
cursor_rgb=0,150,40

; exit_command=
clear_command=CLS\r

on_select=A0:\r

;cursor
left=send:\x01
right=send:\x06
up=history_previous
down=history_next

alt_up=send:\e[A
alt_down=send:\e[B

insert=send:\x16
delete=send:\x07
home=send:\x02
end=send:\x17
page_up=send:\e
page_down=send:\e

; Omitted key mappings from firmware defaults:
; ctrl_left=send:\x11\x02
; ctrl_right=send:\x11\x17
; ctrl_home=send:\x11\x18
; ctrl_end=send:\x11\x0b
; ctrl_delete=send:\x0b
; ctrl_insert=send:\x11\x05


[bank1]
name=A7: MBASIC
; Inactive defaults below: remove ';' and edit only to override.
; mode inherits [global]; zoom geometry inherits [display:HALID].
; Replace COLSxROWS before enabling any zoomN_terminal line.
; MBASIC; INI local_compose overrides the native adapter fallback.
; Ctrl or Shift combos for cursor and sixpack

;editor
screen_line=true
escape_cancels=true
input_adapter=local_compose
command_new_line=true

;cursor colors
active_line_rgb=205,255,205
cursor_rgb=0,150,40

;unified exit and cls
exit_command=system\r
clear_command=print chr$(27);"[2J";chr$(27);"[H"\r

;action
on_select=A7:\r

;cursors
left=send:\x08
right=send:\x20
up=history_previous
down=history_next

alt_up=none
alt_down=none

;sixpack
insert=none
delete=send:1D
home=send:L
end=send:X\e
page_up=none
page_down=none


[bank2]
name=TE
; Inactive defaults below: remove ';' and edit only to override.
; mode inherits [global]; zoom geometry inherits [display:HALID].
; Replace COLSxROWS before enabling any zoomN_terminal line.
; TE v1.11 help; custom WordStar-like keys, not the generic preset.
; Ctrl or Shift combos for cursor and sixpack

;editor
editing_surface=screen

;cursor colors
active_line_rgb=205,255,205
cursor_rgb=0,150,40

;action
on_select=

;cursor
left=send:\x13
right=send:\x04
up=send:\x05
down=send:\x18

alt_up=history_previous
alt_down=history_next

;sixpack
insert=none
delete=send:\x07
home=send:\x11S
end=send:\x11D
page_up=send:\x03
page_down=send:\x12


[bank3]
name=A2: TP301
; Inactive defaults below: remove ';' and edit only to override.
; mode inherits [global]; zoom geometry inherits [display:HALID].
; Replace COLSxROWS before enabling any zoomN_terminal line.
; Turbo Pascal; modifier fallbacks use ANSI sequences.
; Ctrl or Shift combos for cursor and sixpack

;editor
editing_surface=screen

;cursor colors
active_line_rgb=205,255,205
cursor_rgb=0,150,40

;unified exit and cls
;in fact, here used to be sent to exit screen editor like "end edit"
; - it MAY work also as Quit from app ???
exit_command=\e[Q
;clear_command=print chr$(27);"[2J";chr$(27);"[H"\r

;action
on_select=A2:\r

;cursor
left=send:\e[D
right=send:\e[C
up=send:\e[A
down=send:\e[B

;modern shortcuts to wordstar
ctrl_left=send:\x01
ctrl_right=send:\x13
ctrl_up=send:\x05
ctrl_down=send:\x18

;these will be mostly browsing "keywords completions" in "screen" state
alt_up=history_previous
alt_down=history_next

;sixpack
insert=send:\e[2
delete=send:\e[3
home=send:\e[H
end=send:\e[F
page_up=send:\e[5
page_down=send:\e[6

;our modern shortcuts to wordstar or my TINST "workarounds" in TP3
ctrl_insert=send:\x0e
ctrl_delete=send:\x0cd
ctrl_home=send:\x06b
ctrl_end=send:\x06e
ctrl_page_up=send:\x10b
ctrl_page_down=send:\x10e



;proposed in-app "filtered keywords completions" switching
;in fact this will dynamically switch behavior of up/dn and ALT+up/dn
;as in-app line-prompt can use up/dn but "screen" must use ALT for that

;alt_home=keywords_previous - this in fact generalizes history_prev
;alt_end=keywords_next      - this in fact generalizes history_next  



[bank4]
name=A3: COMAL
; Inactive defaults below: remove ';' and edit only to override.
; mode inherits [global]; zoom geometry inherits [display:HALID].
; Replace COLSxROWS before enabling any zoomN_terminal line.
; COMAL; modifier fallbacks use ANSI sequences.
; Ctrl or Shift combos for cursor and sixpack

;cursor colors
active_line_rgb=205,255,205
cursor_rgb=0,150,40

;unified exit and cls
exit_command=BYE\r
clear_command=PAGE\r

;action
on_select=A3:\r

;cursor
left=send:\e[D
right=send:\e[C
up=send:\e[A
down=send:\e[B

alt_up=history_previous
alt_down=history_next

;sixpac
home=send:\e[H
end=send:\e[F
insert=send:\e[2~
delete=send:\e[3~
page_up=send:\e[5~
page_down=send:\e[6~


[bank5]
name=A1: BBC BASIC
; Inactive defaults below: remove ';' and edit only to override.
; mode inherits [global]; zoom geometry inherits [display:HALID].
; Replace COLSxROWS before enabling any zoomN_terminal line.
; BBC DIST.Z80 for base keys; modifiers use ANSI fallbacks.
; Ctrl or Shift combos for cursor and sixpack

;editor
editing_surface=line
screen_line=true
trim_left=true
line_prefix=>
activate_prefix=>
activate_numbered_line=true
escape_cancels=true

;cursor colors
active_line_rgb=205,255,205
cursor_rgb=0,150,40

;unified exit and cls
exit_command=quit\r
clear_command=print chr$(27);"[2J";chr$(27);"[H"\r

;action
on_select=A1:\r

;cursor
left=send:\x0a
right=send:\x0c
up=history_previous
down=history_next

alt_up=send:\x07
alt_down=send:\x0f

;sixpack
insert=send:\x11
delete=send:\x12
home=send:\x06
end=send:\x0e
page_up=send:\e[5~
page_down=send:\e[6~

;history - but WHY ONLY HERE when it is in fact GLOBAL ????
history_clear=\x06\x18
history_retype_delay_ms=100

